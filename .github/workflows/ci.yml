name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run deploy (rsync --dry-run preview without modifying server)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_mysql, curl, mbstring, gd, zip
          coverage: none
          tools: composer:v2

      - name: Validate Composer configuration
        run: composer validate --strict

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress

      - name: PHP Syntax Lint (php -l)
        run: |
          echo "Running syntax check (php -l) on all PHP files..."
          ERRORS=0
          while IFS= read -r -d '' file; do
            if ! php -l "$file" > /dev/null 2>&1; then
              echo "::error file=$file::PHP syntax error in $file"
              php -l "$file"
              ERRORS=$((ERRORS + 1))
            fi
          done < <(find . -type f -name "*.php" ! -path "./vendor/*" ! -path "./node_modules/*" ! -path "./scratch/*" -print0)

          if [ "$ERRORS" -gt 0 ]; then
            echo "❌ Syntax lint failed with $ERRORS error(s)."
            exit 1
          fi
          echo "✅ All PHP files passed syntax check."

      - name: Run PHPUnit Test Suite
        run: ./vendor/bin/phpunit --testdox

      - name: Run PHPStan Static Analysis
        run: ./vendor/bin/phpstan analyse --memory-limit 512M

      - name: Security Check - Composer Audit
        run: composer audit

      - name: Security Check - Secret Scanning (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

      - name: Security Check - Block Committed Secrets & Private Keys
        run: |
          echo "Verifying no private keys or committed .env files exist in git index..."
          BLOCKED=$(git ls-files | grep -E '^(\.env|\.env\..*|.*\.key|.*id_rsa.*)$' | grep -v '^\.env\.example$' || true)
          if [ -n "$BLOCKED" ]; then
            echo "::error::Prohibited sensitive files committed in git:"
            echo "$BLOCKED"
            exit 1
          fi
          echo "✅ No prohibited files tracked in git."

      - name: Security Check - Audit Debug Leftovers
        run: |
          echo "Auditing for active phpinfo() or var_dump() leftovers in application code..."
          MATCHES=$(grep -rn --include="*.php" --exclude-dir={vendor,node_modules,scratch,tests} -E '(var_dump|phpinfo)\s*\(' . | grep -vE ':[0-9]+:\s*(//|#|\*)' || true)
          if [ -n "$MATCHES" ]; then
            echo "::error::Active debug statement detected in production code:"
            echo "$MATCHES"
            exit 1
          fi
          echo "✅ No active debug statements found."

      - name: Security Check - Audit Dangerous Code Patterns (Warnings)
        run: |
          echo "Scanning for risky legacy patterns (reported as warnings)..."
          RISKY=$(grep -rn --include="*.php" --exclude-dir={vendor,node_modules,scratch,tests} -E 'eval\s*\(' . || true)
          if [ -n "$RISKY" ]; then
            echo "::warning::Potentially risky eval() calls detected:"
            echo "$RISKY" | head -n 20
          else
            echo "✅ No eval() occurrences found."
          fi

  deploy:
    name: Deploy to Production
    needs: verify
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      SSH_HOST: ${{ secrets.SSH_HOST || vars.SSH_HOST }}
      SSH_PORT: ${{ secrets.SSH_PORT || vars.SSH_PORT || '22' }}
      SSH_USER: ${{ secrets.SSH_USER || vars.SSH_USER }}
      SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS || vars.SSH_KNOWN_HOSTS }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || vars.DEPLOY_PATH }}
      HEALTH_CHECK_URL: ${{ secrets.HEALTH_CHECK_URL || vars.HEALTH_CHECK_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Deployment Configuration
        run: |
          echo "Validating deployment secrets and configuration..."
          MISSING=""
          [ -z "$SSH_HOST" ] && MISSING="$MISSING SSH_HOST"
          [ -z "$SSH_USER" ] && MISSING="$MISSING SSH_USER"
          [ -z "${{ secrets.SSH_PRIVATE_KEY }}" ] && MISSING="$MISSING SSH_PRIVATE_KEY"
          [ -z "$SSH_KNOWN_HOSTS" ] && MISSING="$MISSING SSH_KNOWN_HOSTS"
          [ -z "$DEPLOY_PATH" ] && MISSING="$MISSING DEPLOY_PATH"

          if [ -n "$MISSING" ]; then
            echo "::error::Missing required deployment credentials:$MISSING"
            echo "Please ensure they are defined under Settings > Environments > production (or Settings > Secrets and variables > Actions)."
            exit 1
          fi
          echo "✅ Configuration validated (SSH_HOST=$SSH_HOST, SSH_PORT=$SSH_PORT, SSH_USER=$SSH_USER, DEPLOY_PATH=$DEPLOY_PATH)."

      - name: Configure SSH Deploy Key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf "%s\n" "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

          SSH_KEY_FILE=$(mktemp)
          printf "%s\n" "${{ secrets.SSH_PRIVATE_KEY }}" > "$SSH_KEY_FILE"
          chmod 600 "$SSH_KEY_FILE"

          echo "SSH_KEY_FILE=$SSH_KEY_FILE" >> "$GITHUB_ENV"

      - name: Remote Pre-Deploy Backup on cPanel
        run: |
          echo "Connecting to cPanel over SSH to take pre-deploy backup..."
          ssh -i "$SSH_KEY_FILE" -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "bash -s -- \"$DEPLOY_PATH\"" < .github/scripts/remote_backup.sh

      - name: Synchronize Files (Rsync with Tar Fallback)
        run: |
          DRY_RUN_ARG=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            DRY_RUN_ARG="--dry-run"
            echo "⚠️ DRY RUN MODE: No files will be modified on the server."
          fi

          echo "Detecting remote rsync availability on server..."
          REMOTE_RSYNC=$(ssh -i "$SSH_KEY_FILE" -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "command -v rsync || which rsync || for p in /usr/bin/rsync /usr/local/bin/rsync /bin/rsync; do [ -x \"\$p\" ] && echo \"\$p\" && break; done" 2>/dev/null || true)

          if [ -n "$REMOTE_RSYNC" ]; then
            echo "✅ Remote rsync found at: $REMOTE_RSYNC"
            echo "Executing rsync over SSH..."
            rsync -az $DRY_RUN_ARG \
              --delete \
              --rsync-path="$REMOTE_RSYNC" \
              --exclude-from='.rsync-exclude' \
              -e "ssh -i $SSH_KEY_FILE -p $SSH_PORT" \
              ./ "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/"
          else
            echo "ℹ️ rsync command not available on remote server. Deploying via streaming tar over SSH..."
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              echo "DRY RUN preview of files that would be deployed:"
              tar --exclude-from='.rsync-exclude' -cvzf /dev/null .
            else
              tar --exclude-from='.rsync-exclude' -czf - . | ssh -i "$SSH_KEY_FILE" -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "tar -xzf - -C \"$DEPLOY_PATH\""
            fi
            echo "✅ Files synchronized successfully."
          fi

      - name: Remote Post-Deploy Tasks (Composer)
        if: ${{ inputs.dry_run != true }}
        run: |
          echo "Running remote post-deploy tasks..."
          ssh -i "$SSH_KEY_FILE" -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "bash -s -- \"$DEPLOY_PATH\"" < .github/scripts/remote_composer.sh

      - name: Health Check Verification
        if: ${{ inputs.dry_run != true }}
        run: |
          echo "Running health check against: $HEALTH_CHECK_URL"
          if [ -z "$HEALTH_CHECK_URL" ]; then
            echo "::warning::HEALTH_CHECK_URL not configured; skipping health check."
            exit 0
          fi
          
          HTTP_STATUS=$(curl -s -o /tmp/health_response.json -w "%{http_code}" --retry 3 --retry-delay 3 --max-time 15 "$HEALTH_CHECK_URL" || true)
          
          echo "HTTP Status Code: $HTTP_STATUS"
          echo "Response Body:"
          cat /tmp/health_response.json 2>/dev/null || true
          echo ""

          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "::error::Health check failed! Expected HTTP 200, got HTTP $HTTP_STATUS"
            exit 1
          fi
          echo "✅ Health check succeeded! Application is healthy on production."

      - name: Cleanup Temporary SSH Key
        if: always()
        run: |
          if [ -n "${SSH_KEY_FILE:-}" ] && [ -f "$SSH_KEY_FILE" ]; then
            shred -u "$SSH_KEY_FILE" 2>/dev/null || rm -f "$SSH_KEY_FILE"
            echo "Cleaned up temporary SSH deploy key."
          fi
