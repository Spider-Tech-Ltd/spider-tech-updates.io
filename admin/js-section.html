	<!--delete event calendar function-->
	<script type="text/javascript">
		$(document).ready(function(){
		readData();
		$(document).on('click', '#delete_event', function(e){
		var ec_id = $(this).data('id');
		SwalDelete(ec_id);
		e.preventDefault();
		});
		})
			
		function SwalDelete(ec_id){
			swal.fire({
				title: 'Are you sure?',
				text: "It will be deleted permanently!",
				type: 'warning',
				showCancelButton: true,
				confirmButtonColor: '#3085d6',
				cancelButtonColor: '#d33',
				confirmButtonText: 'Yes, delete it!',
				showLoaderOnConfirm: true,
				
				preConfirm: function() {
				return new Promise(function(resolve) {
				
					$.ajax({
						type:'POST',
						url:'all_event_calendar.php',
						data:'delete_ec='+ec_id,
					})
					.done(function(response){
						swal.fire('Deleted!', response.message, response.status);
						window.location.replace("all_event_calendar.php");
					})
					.fail(function(){
						swal.fire('Oops...', 'Something went wrong!', 'error');
					});
				});
				},
				allowOutsideClick: false			  
			});	
		}

		function readData(){
				$('#load_content').load('event_calendar_table');	
		}	
		
		$(document).ready(function(){
                $('#applicant_program').on('change',function(){
                  var progID = $(this).val();
                  if(progID){
                    $.ajax({
                      type:'POST',
                      
                      data:'progid='+progID,
                      url: '../mode_study.php',
                      success:function(html){
                      $('#mode_study').html(html);    
                      }
                    }); 
                  }else{
                    $('#mode_study').html('<option value="">Select programme first</option>'); 
                  }
                });
              });
	</script>
